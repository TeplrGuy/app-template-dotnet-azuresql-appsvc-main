name: CD - Staging (US2)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (defaults to current SHA)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

env:
  TF_WORKING_DIR: infra/terraform/envs/staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      backend_url: ${{ steps.tfout.outputs.backend_url }}
      frontend_url: ${{ steps.tfout.outputs.frontend_url }}
      backend_app: ${{ steps.tfout.outputs.backend_app }}
      frontend_app: ${{ steps.tfout.outputs.frontend_app }}
      resource_group: ${{ steps.tfout.outputs.resource_group }}
      acr_server: ${{ steps.tfout.outputs.acr_server }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required repo variables
        run: |
          MISSING=""
          [ -z "${{ vars.AZURE_CLIENT_ID }}" ] && MISSING="$MISSING AZURE_CLIENT_ID"
          [ -z "${{ vars.AZURE_TENANT_ID }}" ] && MISSING="$MISSING AZURE_TENANT_ID"
          [ -z "${{ vars.AZURE_SUBSCRIPTION_ID }}" ] && MISSING="$MISSING AZURE_SUBSCRIPTION_ID"
          [ -z "${{ vars.TF_NAME_PREFIX }}" ] && MISSING="$MISSING TF_NAME_PREFIX"
          if [ -n "$MISSING" ]; then
            echo "Missing required vars:$MISSING"
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP || format('{0}-tfstate-rg', vars.TF_NAME_PREFIX) }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT || format('{0}tfstate', vars.TF_NAME_PREFIX) }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER || 'tfstate' }}" \
            -backend-config="key=staging.terraform.tfstate"

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          terraform apply -auto-approve \
            -var "name_prefix=${{ vars.TF_NAME_PREFIX }}" \
            -var "location=${{ vars.AZURE_LOCATION || 'eastus2' }}" \
            -var "aad_admin_login=${{ vars.AAD_ADMIN_LOGIN || 'sqladmin' }}" \
            -var "aad_admin_object_id=${{ vars.AAD_ADMIN_OBJECT_ID || '' }}" \
            -var "tenant_id=${{ vars.AZURE_TENANT_ID }}"

      - name: Read Terraform outputs
        id: tfout
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "backend_app=$(terraform output -raw backend_app_name)" >> $GITHUB_OUTPUT
          echo "frontend_app=$(terraform output -raw frontend_app_name)" >> $GITHUB_OUTPUT
          echo "backend_url=https://$(terraform output -raw backend_default_hostname)" >> $GITHUB_OUTPUT
          echo "frontend_url=https://$(terraform output -raw frontend_default_hostname)" >> $GITHUB_OUTPUT
          echo "resource_group=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT
          echo "acr_server=$(terraform output -raw acr_login_server)" >> $GITHUB_OUTPUT
          echo "sql_server_fqdn=$(terraform output -raw sql_server_fqdn)" >> $GITHUB_OUTPUT
          echo "sql_database_name=$(terraform output -raw sql_database_name)" >> $GITHUB_OUTPUT
          echo "backend_principal_id=$(terraform output -raw backend_principal_id)" >> $GITHUB_OUTPUT

      - name: Grant backend managed identity SQL access
        run: |
          BACKEND_APP="${{ steps.tfout.outputs.backend_app }}"
          SQL_SERVER="${{ steps.tfout.outputs.sql_server_fqdn }}"
          SQL_DB="${{ steps.tfout.outputs.sql_database_name }}"
          # Get an access token for Azure SQL using the pipeline's OIDC identity
          TOKEN=$(az account get-access-token --resource https://database.windows.net --query accessToken -o tsv)
          # Create the managed identity user and grant permissions (idempotent)
          sqlcmd -S "tcp:${SQL_SERVER},1433" -d "${SQL_DB}" --authentication-method=ActiveDirectoryAccessToken --access-token "${TOKEN}" -Q "
            IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = '${BACKEND_APP}')
            BEGIN
              CREATE USER [${BACKEND_APP}] FROM EXTERNAL PROVIDER;
            END;
            ALTER ROLE db_datareader ADD MEMBER [${BACKEND_APP}];
            ALTER ROLE db_datawriter ADD MEMBER [${BACKEND_APP}];
            ALTER ROLE db_ddladmin ADD MEMBER [${BACKEND_APP}];
          " || echo "⚠️ SQL user provisioning failed (may need manual setup)"

      - name: Push Prisma schema to database
        working-directory: ./backend
        run: |
          npm ci --ignore-scripts
          npx prisma generate
          SQL_SERVER="${{ steps.tfout.outputs.sql_server_fqdn }}"
          SQL_DB="${{ steps.tfout.outputs.sql_database_name }}"
          export SQLSERVER_CONNECTION_STRING="sqlserver://${SQL_SERVER}:1433;database=${SQL_DB};user=sqladminuser;password=${SQL_ADMIN_PASSWORD};encrypt=true;trustServerCertificate=false"
          npx prisma db push --skip-generate --accept-data-loss || echo "⚠️ Schema push failed"
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: ACR login
        run: az acr login --name "$(echo '${{ steps.tfout.outputs.acr_server }}' | cut -d. -f1)"

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tfout.outputs.acr_server }}/backend:${{ inputs.image_tag || github.sha }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tfout.outputs.acr_server }}/frontend:${{ inputs.image_tag || github.sha }}

      - name: Deploy backend container
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          ACR="${{ steps.tfout.outputs.acr_server }}"
          echo "Deploying backend:${TAG} to ${{ steps.tfout.outputs.backend_app }}"
          az webapp config container set \
            --name "${{ steps.tfout.outputs.backend_app }}" \
            --resource-group "${{ steps.tfout.outputs.resource_group }}" \
            --container-image-name "${ACR}/backend:${TAG}" \
            --container-registry-url "https://${ACR}"
          az webapp restart \
            --name "${{ steps.tfout.outputs.backend_app }}" \
            --resource-group "${{ steps.tfout.outputs.resource_group }}"

      - name: Deploy frontend container
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          ACR="${{ steps.tfout.outputs.acr_server }}"
          echo "Deploying frontend:${TAG} to ${{ steps.tfout.outputs.frontend_app }}"
          az webapp config container set \
            --name "${{ steps.tfout.outputs.frontend_app }}" \
            --resource-group "${{ steps.tfout.outputs.resource_group }}" \
            --container-image-name "${ACR}/frontend:${TAG}" \
            --container-registry-url "https://${ACR}"
          az webapp restart \
            --name "${{ steps.tfout.outputs.frontend_app }}" \
            --resource-group "${{ steps.tfout.outputs.resource_group }}"

      - name: Verify application health
        run: |
          echo "Waiting 120s for containers to start (first deployment may take longer)..."
          sleep 120
          echo "Checking backend health..."
          curl -sf "${{ steps.tfout.outputs.backend_url }}/api" --retry 15 --retry-delay 20 --retry-all-errors --max-time 15 || echo "⚠️ Backend not ready yet (may still be pulling container image)"
          echo ""
          echo "Checking frontend health..."
          curl -sf "${{ steps.tfout.outputs.frontend_url }}" --retry 15 --retry-delay 20 --retry-all-errors --max-time 15 || echo "⚠️ Frontend not ready yet (may still be pulling container image)"
          echo ""
          echo "Health check phase complete"

  smoke-tests:
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps
        working-directory: frontend
      - name: Playwright smoke against staging
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.frontend_url }}
        run: npm run e2e -- tests/e2e/smoke.spec.ts

  dast:
    runs-on: ubuntu-latest
    needs: [deploy, smoke-tests]
    if: ${{ vars.DAST_ENABLED == 'true' }}
    steps:
      - name: OWASP ZAP baseline (DAST)
        run: |
          mkdir -p zap
          docker run --rm -v "${PWD}/zap:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t "${{ needs.deploy.outputs.frontend_url }}" -r zap-report.html || true
          echo "DAST completed (see zap-report.html)."
